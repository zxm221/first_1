name: Update TVBox Sources

on:
  schedule:
    # cron 时区为 UTC，'0 22 * * *' = 北京时间每天 06:00；如需其他时间改这里
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # 支持在 Actions 页手动触发

permissions:
  contents: write  # 允许自动提交更新

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python tvbox_updater.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes, skip push"
          else
            git commit -m "chore: auto update tvbox sources $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
